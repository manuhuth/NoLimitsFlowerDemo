name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Julia 1.11 is what juliapkg selects for NoLimitsPy, so julia_env must be built
      # with the same minor version.
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The shared Julia project: registered NoLimits (>= 0.2.6 has the federation
      # primitives) plus CSV for the warfarin loader. It exists only for CSV; without it
      # juliapkg would resolve NoLimits by itself and the PYTHON_JULIAPKG_* pinning below
      # could go too.
      - name: Build julia_env
        run: |
          julia -e 'import Pkg; Pkg.activate("julia_env");
                    Pkg.add([Pkg.PackageSpec(name="NoLimits", version="0.2.6"),
                             Pkg.PackageSpec(name="PythonCall"),
                             Pkg.PackageSpec(name="CSV")]); Pkg.precompile()'

      # Editable install: nolimits_flower/__init__.py pins julia_env/ relative to the
      # package, which only resolves to the repo checkout when installed in place.
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -e . "git+https://github.com/manuhuth/NoLimitsPy" pytest

      - name: Versions
        env:
          PYTHON_JULIAPKG_PROJECT: ${{ github.workspace }}/julia_env
          PYTHON_JULIAPKG_OFFLINE: "yes"
        run: |
          flwr --version
          python -c "import NoLimitsPy as nl; nl.seval('1'); print(nl.status())"

      # The warfarin loader downloads once and caches to data/warfarin.csv; priming it
      # here keeps both test lanes offline (and the equivalence test skips without it).
      - name: Prime the warfarin data cache
        env:
          PYTHON_JULIAPKG_PROJECT: ${{ github.workspace }}/julia_env
          PYTHON_JULIAPKG_OFFLINE: "yes"
        run: python -c "from nolimits_flower import task; print(task.dataset('warfarin').shape)"

      - name: Fast tests
        run: pytest tests -m "not slow and not veryslow" -q

      # Additivity (all four models) + PK/growth federated fits + fault injection. The
      # neural model is `veryslow` and excluded here; run it on demand with `-m veryslow`.
      - name: Slow equivalence tests
        timeout-minutes: 45
        env:
          PYTHON_JULIAPKG_PROJECT: ${{ github.workspace }}/julia_env
          PYTHON_JULIAPKG_OFFLINE: "yes"
        run: pytest tests -m slow -q -s
