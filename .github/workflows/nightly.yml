name: Nightly full suite

# The complete acceptance matrix, off the per-push path so a slow/red heavy suite never
# blocks pushes: all-model additivity, the PK/growth federated fits, DP fits, fault
# injection, AND the veryslow neural model. Runs on a nightly cron and on demand.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build julia_env
        run: |
          julia -e 'import Pkg; Pkg.activate("julia_env");
                    Pkg.add([Pkg.PackageSpec(name="NoLimits", version="0.2.6"),
                             Pkg.PackageSpec(name="PythonCall"),
                             Pkg.PackageSpec(name="CSV")]); Pkg.precompile()'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -e . "git+https://github.com/manuhuth/NoLimitsPy" pytest

      - name: Versions
        env:
          PYTHON_JULIAPKG_PROJECT: ${{ github.workspace }}/julia_env
          PYTHON_JULIAPKG_OFFLINE: "yes"
        run: |
          flwr --version
          python -c "import NoLimitsPy as nl; nl.seval('1'); print(nl.status())"

      - name: Prime the warfarin data cache
        env:
          PYTHON_JULIAPKG_PROJECT: ${{ github.workspace }}/julia_env
          PYTHON_JULIAPKG_OFFLINE: "yes"
        run: python -c "from nolimits_flower import task; print(task.dataset('warfarin').shape)"

      - name: Fast tests
        run: pytest tests -m "not slow and not veryslow" -q

      # Everything heavy: all-model additivity, federated fits, DP, fault injection, and
      # the veryslow neural model.
      - name: Full equivalence suite
        env:
          PYTHON_JULIAPKG_PROJECT: ${{ github.workspace }}/julia_env
          PYTHON_JULIAPKG_OFFLINE: "yes"
        run: pytest tests -m "slow or veryslow" -q -s
