[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nolimits-flower"
version = "0.1.0"
description = "Federated nonlinear mixed-effects estimation with Flower and NoLimitsPy"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "flwr[simulation]>=1.33.0",
    # NoLimitsPy is not on PyPI, so it installs as a PEP 508 direct-URL dependency:
    # `pip install -e .` alone pulls it. (Valid because this app is GitHub-installed, not
    # published to PyPI, which forbids direct-URL deps.)
    "NoLimitsPy @ git+https://github.com/manuhuth/NoLimitsPy",
    "numpy",
    "pandas",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.flwr.app]
publisher = "manuhuth"
fab-format-version = 1
flwr-version-target = "1.33.0"
# FAB hygiene: the bundle is shipped to every SuperNode, so julia_env/ (gigabytes) and
# .venv/ must never enter it. Both are kept out by .gitignore, which `flwr build`
# honours, on top of flwr's built-in excludes (.venv, __pycache__, test_*.py). No
# fab-exclude: with flwr 1.33 any user pattern turns the collected .gitignore into a
# hard "conflicts with built-in constraints" build error. Re-inspect after upgrades:
#   flwr build && python -c "import zipfile,glob;print(sorted(zipfile.ZipFile(sorted(glob.glob('*.fab'))[-1]).namelist()))"

[tool.flwr.app.components]
serverapp = "nolimits_flower.server_app:app"
clientapp = "nolimits_flower.client_app:app"

[tool.flwr.app.config]
model = "warfarin"  # warfarin | theophylline | warfarin-nn | orange (see README Models)
estimator = "laplace"
ghq-level = 1  # the level whose federated fit reliably converges to the pooled optimum on
               # this demo (levels 2-3 converge but to a rougher GHQ local optimum; see
               # docs/estimators.md). NoLimits' own numerically stable range is 1-3.
data-source = "warfarin"  # or "simulated" for the seeded synthetic demo
data-seed = 20260818  # which simulated data set; ignored by data-source="warfarin"
max-rounds = 100
fail-site = -1  # testing only: make this site id raise in its handler

# Differential privacy (subject-level). dp=false runs the exact L-BFGS-B fit above; dp=true
# switches to fixed-schedule DP-Adam on per-subject-clipped, Gaussian-noised gradients and
# writes results-path with the spent (eps, delta). See docs/differential-privacy.md.
dp = false
dp-clip = 20.0             # per-subject gradient L2 clip C (the sensitivity bound). PUBLIC
                          # hyperparameter: tune it to the model's per-subject gradient
                          # magnitude, NEVER from the private data. Too small saturates every
                          # subject and collapses the omegas; 20 suits the warfarin default.
dp-noise-multiplier = 1.0 # sigma; Gaussian noise std on the summed gradient is sigma*C
dp-rounds = 50            # DP-Adam rounds T - this IS the privacy budget (composition length)
dp-lr = 0.05              # fixed Adam learning rate (no line search under noise)
dp-delta = 1e-5          # target delta for the (eps, delta) report
dp-clip-mode = "per-group"  # "per-group" (recommended: clips each parameter group on its own,
                            # so it preserves the variance components) or "joint" (one clip over
                            # the whole gradient, which collapses the omegas). Same (eps, delta).
dp-final-value = false   # also privately release the final (noised) objective for reporting
dp-value-clip = 100.0    # per-subject clip on the objective value, when dp-final-value is on
results-path = "results.json"  # where the dp fit writes its results + (eps, delta) block

[tool.pytest.ini_options]
markers = [
    "slow: boots one Julia per site and fits (minutes)",
    "veryslow: the neural model (87 params, extra child boots); CI can skip it",
]
